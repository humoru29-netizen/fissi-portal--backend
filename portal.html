  *{box-sizing:border-box;}
  body{margin:0; background:var(--parch); color:var(--ink); font-family:'Source Sans 3', system-ui, sans-serif; -webkit-tap-highlight-color: transparent;}
  h1,h2,h3{font-family:'Playfair Display', Georgia, serif; margin:0;}
  button{font-family:inherit; cursor:pointer;}
  input, select{font-family:inherit;}

  header.topbar{background:var(--navy); border-bottom:1px solid var(--navy-deep);}
  .topbar-inner{max-width:900px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex; align-items:center; gap:10px; background:none; border:none; padding:0; cursor:pointer;}
  .brand-name{color:var(--gold-soft); font-weight:700; font-size:15px; line-height:1.2; text-align:left;}
  .brand-sub{color:#b9c2d4; font-size:10.5px; letter-spacing:.03em;}
  .session-chip{color:#cdd5e3; font-size:12px; margin-right:8px;}
  .logout-btn{background:var(--wine); color:var(--parch); border:none; border-radius:6px; padding:7px 12px; font-size:12px; font-weight:700; display:inline-flex; align-items:center; gap:5px;}

  main{max-width:900px; margin:0 auto; padding:0 16px 48px;}
  footer{text-align:center; font-size:12px; color:#7a7263; padding:24px 16px;}
  footer b{color:var(--wine);}

  .toast{position:fixed; top:16px; right:16px; left:16px; z-index:50; background:var(--navy); color:var(--parch); border-radius:8px; padding:12px 16px; font-size:14px; font-weight:600; box-shadow:0 6px 20px rgba(0,0,0,.25); max-width:420px; margin-left:auto;}
  .toast.bad{background:#7a2c2c;}

  .card{background:#fffdf8; border:1px solid var(--line); border-radius:10px; box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .card.pad{padding:20px;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:6px; padding:11px 16px; font-size:14px; font-weight:700; border:none; transition:filter .15s;}
  .btn:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn.primary{background:var(--wine); color:var(--parch);}
  .btn.navy{background:var(--navy); color:var(--parch);}
  .btn.gold{background:var(--gold); color:var(--navy-deep);}
  .btn.ghost{background:transparent; color:var(--navy); border:1.5px solid var(--navy);}
  .btn.danger{background:#7a2c2c; color:#fbe9e9;}
  .btn.block{width:100%;}
  .btn.sm{padding:7px 12px; font-size:12px;}

  .field{display:block; margin-bottom:14px;}
  .field-label{display:block; font-size:11px; font-weight:700; letter-spacing:.02em; color:var(--navy); margin-bottom:5px;}
  .input{width:100%; border-radius:6px; border:1px solid #d8cfb8; background:#fffdf8; padding:10px 12px; font-size:14px; color:var(--ink);}
  .input:focus{outline:2px solid var(--gold); outline-offset:1px;}

  .role-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .role-opt{border-radius:6px; padding:9px 10px; font-size:12px; font-weight:700; border:1px solid #d8cfb8; background:transparent; color:var(--navy);}
  .role-opt.active{background:var(--navy); color:var(--parch); border-color:var(--navy);}

  .err-box{font-size:12px; margin-bottom:12px; border-radius:6px; padding:9px 12px; background:#f5dcdc; color:#8a2020;}
  .center-note{font-size:12px; text-align:center; margin-top:16px; color:#8a8375;}
  .center-note a, .link-btn{font-weight:700; color:var(--wine); text-decoration:underline; background:none; border:none; font-size:inherit; cursor:pointer; padding:0;}
  .fine-note{font-size:11px; text-align:center; margin-top:12px; color:#b0a996;}

  .hero{padding-top:48px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:18px;}
  .hero h1{font-size:24px; font-weight:800; color:var(--navy); max-width:560px;}
  .hero p{max-width:520px; font-size:14px; color:#6b6255; margin:0;}
  .hero-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  .tiles{display:grid; grid-template-columns:1fr; gap:14px; margin-top:44px;}
  @media(min-width:680px){ .tiles{grid-template-columns:1fr 1fr 1fr;} .role-grid{grid-template-columns:repeat(4,1fr);} }
  .tile h3{font-size:15px; color:var(--navy); margin:8px 0 4px;}
  .tile p{font-size:12px; color:#8a8375; line-height:1.5; margin:0;}

  .auth-wrap{max-width:380px; margin:36px auto 0;}

  .section-title{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .section-title h2{font-size:17px; font-weight:700; color:var(--navy);}
  .section-sub{font-size:12px; color:#8a8375; margin:2px 0 16px;}

  .tabs{display:flex; gap:5px; overflow-x:auto; padding-bottom:6px; margin-bottom:20px;}
  .tab{white-space:nowrap; border:none; border-radius:6px; padding:9px 14px; font-size:12px; font-weight:700; background:var(--tile); color:var(--navy);}
  .tab.active{background:var(--wine); color:var(--parch);}

  .row-item{display:flex; align-items:center; justify-content:between; justify-content:space-between; border-bottom:1px solid #eee3c9; padding:11px 0; gap:10px;}
  .row-item:last-child{border-bottom:none;}
  .row-title{font-weight:700; font-size:13.5px; color:var(--navy); margin:0 0 2px;}
  .row-sub{font-size:11.5px; color:#8a8375; margin:0;}
  .row-actions{display:flex; gap:6px; flex-shrink:0;}

  .pill{display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:4px 10px; font-size:11px; font-weight:700; white-space:nowrap;}
  .pill.neutral{background:#eee6cf; color:var(--navy);}
  .pill.good{background:#dcefdd; color:#1e5c2c;}
  .pill.warn{background:#f6e6c8; color:#8a5a10;}
  .pill.bad{background:#f5dcdc; color:#8a2020;}

  .empty{text-align:center; padding:36px 14px; font-size:13px; color:#8a8375; border:1.5px dashed #d8cfb8; border-radius:8px;}

  .two-col{display:grid; grid-template-columns:1fr; gap:16px;}
  @media(min-width:680px){ .two-col{grid-template-columns:1fr 1fr;} }
  .search-list{margin-top:12px; max-height:230px; overflow-y:auto; display:flex; flex-direction:column; gap:4px;}
  .search-item{width:100%; display:flex; align-items:center; justify-content:space-between; border-radius:6px; padding:9px 12px; font-size:13.5px; text-align:left; border:none; background:var(--tile); color:var(--ink);}
  .search-item.active{background:var(--gold); color:var(--navy-deep); font-weight:700;}

  .subject-row{display:flex; align-items:center; justify-content:space-between; border-radius:6px; padding:9px 12px; font-size:13.5px; background:var(--tile); margin-bottom:6px;}
  .subject-row button{background:none; border:none; color:#a53535; font-size:16px; line-height:1;}

  .crest-svg{display:block;}

  #printArea{display:none;}
  @media print{
    body > div#app{display:none !important;}
    #printArea{display:block !important; padding:24px; font-family:Georgia,serif; color:#1a2a4a;}
    .rc-header{text-align:center; border-bottom:3px double #6E1F2E; padding-bottom:10px; margin-bottom:16px;}
    .rc-header h1{margin:0; font-size:20px; color:#0B1F3B;}
    .rc-header p{margin:2px 0; font-size:12px;}
    .rc-header p.rc-loc{color:#6E1F2E; font-weight:bold;}
    .rc-header p.rc-sub{color:#9C7A24; font-weight:bold; letter-spacing:.3px;}
    .rc-meta{display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px 14px; font-size:12.5px; margin-bottom:14px;}
    .rc-table{width:100%; border-collapse:collapse; font-size:13px; margin-bottom:16px;}
    .rc-table th, .rc-table td{border:1px solid #999; padding:6px 8px; text-align:left;}
    .rc-summary{display:flex; justify-content:space-between; font-size:13px; margin-bottom:20px; font-weight:bold;}
    .rc-sign{display:flex; justify-content:space-between; margin-top:110px; font-size:12px;}
    .rc-sign div{width:40%; border-top:1px solid #333; padding-top:4px; text-align:center; position:relative;}
    .rc-stamp{position:absolute; bottom:8px; right:6%; width:100px; height:100px; opacity:0.88; transform:rotate(-9deg); mix-blend-mode:multiply; pointer-events:none;}
    .rc-page{page-break-after:always; position:relative;}
    .rc-page:last-child{page-break-after:auto;}
    .rc-photo{width:72px; height:86px; object-fit:cover; border:1px solid #1a2a4a;}
    .rc-watermark{
      position:absolute; top:0; left:0; right:0; bottom:0;
      background-image:var(--rc-watermark-img);
      background-repeat:no-repeat; background-position:center; background-size:60% auto;
      opacity:0.10; z-index:0; pointer-events:none;
      -webkit-print-color-adjust:exact; print-color-adjust:exact;
    }
    .rc-content{position:relative; z-index:1;}
  }
  .stu-avatar{width:38px; height:38px; border-radius:50%; object-fit:cover; flex-shrink:0; border:1px solid var(--line);}
  .stu-avatar-placeholder{width:38px; height:38px; border-radius:50%; background:#efe7d8; color:#a89a7c; display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0; border:1px solid var(--line);}
  .photo-input{font-size:11px; max-width:150px;}
  .dash-avatar{width:52px; height:52px; border-radius:50%; object-fit:cover; border:2px solid var(--wine);}
</style>
</head>

function loadKey(key, fallback){
  // 1) Firebase, if configured — this is what makes the hosted version shared
  if (firestoreDb){
    return firestoreDb.collection("fissi_data").doc(key).get()
      .then(doc => (doc.exists && doc.data().value) ? JSON.parse(doc.data().value) : fallback)
      .catch(e => { console.error("firestore get failed", key, e); return fallback; });
  }
  // 2) Nothing configured — fall back to this browser's localStorage so data
  // survives reloads/logouts on this device, instead of resetting every time.
  try {
    const raw = window.localStorage.getItem("fissi_local:" + key);
    return Promise.resolve(raw ? JSON.parse(raw) : fallback);
  } catch (e) {
    console.error("localStorage read failed", key, e);
    return Promise.resolve(fallback);
  }
}

// Saves never block the UI — they run in the background and retry a couple
// of times on transient server errors. If they still fail, the change stays
// live in this tab's memory and a small "sync" note appears instead of a
// raw console error, so a backend hiccup can't make the app look broken.
function saveKey(key, value, attempt){
  attempt = attempt || 0;
  const markOk = () => { if (state.syncIssue) { state.syncIssue = false; render(); } };
  const markFailed = (e) => {
    console.error("storage set failed", key, attempt, e);
    if (attempt < 2) {
      setTimeout(() => saveKey(key, value, attempt + 1), 700 * (attempt + 1));
    } else {
      state.syncIssue = true;
      render();
    }
  };
  try {
    if (firestoreDb){
      firestoreDb.collection("fissi_data").doc(key).set({ value: JSON.stringify(value) }).then(markOk).catch(markFailed);
      return;
    }
    // nothing configured — persist to this browser's localStorage instead of
    // dropping the data. Not shared across devices, but it survives reloads.
    window.localStorage.setItem("fissi_local:" + key, JSON.stringify(value));
    markOk();
  } catch (e) {
    markFailed(e);
  }
}

const state = {
  loading: true,
  users: [],
  subjects: DEFAULT_SUBJECTS.slice(),
  classes: DEFAULT_CLASSES.slice(),
  academics: { results: [], assignments: [] },

  announcements: [],
  editGrants: [],
  teacherAssignments: [],
  session: null,
  screen: "welcome",
  toast: null,
  // transient UI state per screen
  ui: {}
};

function setState(patch){ Object.assign(state, patch); render(); }
function setUI(patch){ state.ui = Object.assign({}, state.ui, patch); render(); }
function notify(msg, tone){
  state.toast = { msg, tone: tone || "good" };
  render();
  clearTimeout(notify._t);
  notify._t = setTimeout(() => { state.toast = null; render(); }, 3200);
}

async function init(){
  try {
    const [u, s, a, f, c, rel, wh, fr, pr, sess, curSess, ann, grants, tAssign] = await Promise.all([
      loadKey(KEYS.users, []),
      loadKey(KEYS.subjects, DEFAULT_SUBJECTS),
      loadKey(KEYS.academics, { results: [], assignments: [] }),
      loadKey(KEYS.fees, []),
      loadKey(KEYS.classes, DEFAULT_CLASSES),
      loadKey(KEYS.releases, []),
      loadKey(KEYS.withheld, []),
      loadKey(KEYS.forceReleased, []),
      loadKey(KEYS.passwordResets, []),
      loadKey(KEYS.sessions, DEFAULT_SESSIONS),
      loadKey(KEYS.currentSession, DEFAULT_SESSIONS[0]),
      loadKey(KEYS.announcements, []),
      loadKey(KEYS.editGrants, []),
      loadKey(KEYS.teacherAssignments, []),
    ]);
    let users = u;
    if (!users.length){
      users = [{ id: uid(), name: "School Administrator", username: "admin", password: "admin123", role: "admin", status: "approved" }];
      saveKey(KEYS.users, users);
    }
    const sessions = (sess && sess.length) ? sess : DEFAULT_SESSIONS.slice();
    Object.assign(state, { loading:false, users, subjects: s, academics: a, fees: f, classes: (c && c.length ? c : DEFAULT_CLASSES.slice()), releases: rel || [], withheld: wh || [], forceReleased: fr || [], passwordResets: pr || [], sessions, currentSession: (curSess && sessions.includes(curSess)) ? curSess : sessions[0], announcements: ann || [], editGrants: grants || [], teacherAssignments: tAssign || [] });
  } catch (e) {
    console.error("init failed, falling back to a fresh local session", e);
    Object.assign(state, {
      loading:false,
      users: [{ id: uid(), name: "School Administrator", username: "admin", password: "admin123", role: "admin", status: "approved" }],
      subjects: DEFAULT_SUBJECTS.slice(),
      classes: DEFAULT_CLASSES.slice(),
      academics: { results: [], assignments: [] },
      fees: [],
      releases: [],
      withheld: [],
      forceReleased: [],
      teacherAssignments: [],
    });
  }

function hasEditAccess(teacherId, studentClass, subject){

function grantEditAccess(e){

}
function revokeEditAccess(id){

}

function persistTeacherAssignments(next){ state.teacherAssignments = next; saveKey(KEYS.teacherAssignments, next); }
function teacherIsAssigned(teacherId, subject, cls){

function teacherAssignedClasses(teacherId){

}

function feeAdjTotal(f){ return f && f.adjustments ? f.adjustments.reduce((sum,a)=>sum+a.amount,0) : 0; }
function feeTotalDue(f){ return f ? f.amountDue + feeAdjTotal(f) : 0; }
function addFeeAdjustment(studentId, term, label, amount){
  label = (label||"").trim();
  amount = Number(amount);
  if (!label || !amount){ notify("Enter a label and a non-zero amount.","bad"); return; }
  const existing = state.fees.find(f=>f.studentId===studentId && f.term===term);
  const adj = { id: uid(), label, amount };
  const record = existing
    ? { ...existing, adjustments: (existing.adjustments||[]).concat([adj]) }
    : { id: uid(), studentId, term, amountDue: 0, amountPaid: 0, adjustments: [adj] };
  const next = existing ? state.fees.map(f=>f.id===existing.id?record:f) : state.fees.concat([record]);
  persistFees(next);
  notify((amount>0?"Charge":"Discount") + " added to fee record.");
  render();
}
function removeFeeAdjustment(studentId, term, adjId){
  const existing = state.fees.find(f=>f.studentId===studentId && f.term===term);
  if (!existing) return;
  const record = { ...existing, adjustments: (existing.adjustments||[]).filter(a=>a.id!==adjId) };

  notify("Adjustment removed.");
  render();
}

}

function releaseKey(cls, session, term){ return cls + "||" + session + "||" + term; }
function persistReleases(next){ state.releases = next; saveKey(KEYS.releases, next); }
function isReleased(cls, session, term){ return state.releases.includes(releaseKey(cls, session, term)); }
function setReleased(cls, session, term, on){
  const key = releaseKey(cls, session, term);
  const next = on
    ? (state.releases.includes(key) ? state.releases : state.releases.concat([key]))
    : state.releases.filter(k => k !== key);
  state.releases = next;
  saveKey(KEYS.releases, next);
  render();
  notify(on ? `Results released to ${cls} students for ${session} ${term}.` : `Results withheld from ${cls} students for ${session} ${term}.`);
}

/* Per-student override on top of the class-wide release switch.
   Three states per student per session/term:
     - "release" override -> always visible, even if class not released
     - "withhold" override -> always hidden, even if class is released
     - no override -> follows the class-wide release switch
   Rankings/positions are unaffected either way — every approved score
   still counts toward class averages and positions. */
function overrideKey(studentId, session, term){ return studentId + "||" + session + "||" + term; }
function persistWithheld(next){ state.withheld = next; saveKey(KEYS.withheld, next); }
function persistForceReleased(next){ state.forceReleased = next; saveKey(KEYS.forceReleased, next); }
function isStudentWithheld(studentId, session, term){ return state.withheld.includes(overrideKey(studentId, session, term)); }
function isStudentForceReleased(studentId, session, term){ return state.forceReleased.includes(overrideKey(studentId, session, term)); }
function studentIsVisible(studentId, session, term, classReleased){
  if (isStudentForceReleased(studentId, session, term)) return true;
  if (isStudentWithheld(studentId, session, term)) return false;
  return classReleased;
}
function studentStatusLabel(studentId, session, term, classReleased){
  if (isStudentForceReleased(studentId, session, term)) return { tone:"good", text:"Released (selected)" };
  if (isStudentWithheld(studentId, session, term)) return { tone:"warn", text:"Withheld (selected)" };
  return classReleased ? { tone:"good", text:"Released" } : { tone:"warn", text:"Withheld" };
}
// mode: "release" | "withhold" | "clear" (clear = follow the class-wide switch)
function bulkSetStudentOverride(studentIds, session, term, mode){
  if (!studentIds.length){ notify("Select at least one student first.", "bad"); return; }
  const keys = studentIds.map(id => overrideKey(id, session, term));
  let wh = state.withheld.filter(k => !keys.includes(k));
  let fr = state.forceReleased.filter(k => !keys.includes(k));
  if (mode==="withhold") wh = wh.concat(keys);
  if (mode==="release") fr = fr.concat(keys);
  persistWithheld(wh);
  persistForceReleased(fr);
  setUI({ resultSelection: {} });
  const label = mode==="withhold" ? "Withheld" : mode==="release" ? "Released" : "Reset to class default";
  notify(`${label} for ${studentIds.length} student(s) — ${session} ${term}.`);
}
function toggleResultSelection(studentId){
  const cur = state.ui.resultSelection || {};
  setUI({ resultSelection: { ...cur, [studentId]: !cur[studentId] } });
}
function toggleSelectAllResults(checked){
  const cls = state.ui.classResultsClass || state.classes[0] || "";
  const session = state.ui.classResultsSession || state.currentSession;
  const term = state.ui.classResultsTerm || "1st Term";
  const { ranked } = classResultsFor(cls, session, term);
  const next = {};
  if (checked) ranked.forEach(r => { next[r.student.id] = true; });
  setUI({ resultSelection: next });
}
function getSelectedResultIds(){
  const sel = state.ui.resultSelection || {};
  return Object.keys(sel).filter(id => sel[id]);
}
function releaseSelectedResults(session, term){ bulkSetStudentOverride(getSelectedResultIds(), session, term, "release"); }
function withholdSelectedResults(session, term){ bulkSetStudentOverride(getSelectedResultIds(), session, term, "withhold"); }
function resetSelectedResults(session, term){ bulkSetStudentOverride(getSelectedResultIds(), session, term, "clear"); }

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function render(){
  const app = document.getElementById("app");
  if (state.loading){
    app.innerHTML = `<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px;">
      ${crestSVG(64)}<p style="font-size:13px; color:var(--navy);">Loading FISSI portal…</p>
    </div>`;
    return;
  }

  if (state.screen === "welcome" && !state.session){
    app.innerHTML = renderWelcome();
    return;
  }

  let body = "";
  if (!state.session){
    if (state.screen === "login") body = renderLogin();
    else if (state.screen === "signup") body = renderSignup();
    else if (state.screen === "forgotPassword") body = renderForgotPassword();
    else body = renderHome();
  } else {
    if (state.screen === "changePassword") body = renderChangePassword();
    else body = renderDashboard();
  }

  app.innerHTML = `
    <header class="topbar">
      <div class="topbar-inner">
        <button class="brand" onclick="goHome()">
          ${crestSVG(40)}
          <span>
            <span class="brand-name" style="display:block;">Faith International Secondary School</span>
            <span class="brand-sub" style="display:block;">ITOBE · OFU LGA · KOGI STATE</span>
          </span>
        </button>

      </div>
    </header>
    ${state.toast ? `<div class="toast ${state.toast.tone==='bad'?'bad':''}">${esc(state.toast.msg)}</div>` : ""}

    <footer>Faith International Secondary School, Itobe — Ofu LGA, Kogi State · <b>In God We Trust</b></footer>
  `;

/* LOGIN                                                                */
/* ------------------------------------------------------------------ */
function renderLogin(){
  const err = state.ui.loginErr || "";
  return `
  <div class="auth-wrap">
    <div class="card pad">
      <div class="section-title"><h2>Log in</h2></div>
      <form onsubmit="return doLogin(event)">
        <label class="field"><span class="field-label">Username</span>
          <input class="input" id="loginUsername" value="${esc(state.ui.loginUsername||"")}" />
        </label>
        <label class="field"><span class="field-label">Password</span>
          <div style="display:flex; gap:6px;">
            <input class="input" type="password" id="loginPassword" style="flex:1;" value="${esc(state.ui.loginPassword||"")}" />
            <button type="button" class="btn ghost sm" onclick="togglePwd('loginPassword', this)">Show</button>
          </div>
        </label>
        ${err ? `<div class="err-box">${esc(err)}</div>` : ""}
        <button class="btn primary block" type="submit">Log in</button>
      </form>
      <p class="center-note">New here? <button class="link-btn" onclick="state.screen='signup'; render();">Create an account</button></p>
      <p class="center-note"><button class="link-btn" onclick="state.screen='forgotPassword'; state.ui={}; render();">Forgot your password?</button></p>
    </div>
  </div>`;
}
function togglePwd(inputId, btn){
  const el = document.getElementById(inputId);
  const showing = el.type === "text";
  el.type = showing ? "password" : "text";
  btn.textContent = showing ? "Show" : "Hide";
}
function doLogin(e){
  e.preventDefault();
  const username = document.getElementById("loginUsername").value.trim();
  const password = document.getElementById("loginPassword").value;
  const u = state.users.find(x => x.username.toLowerCase()===username.toLowerCase() && x.password===password);
  if (!u){ setUI({loginErr:"Username or password is incorrect.", loginUsername:username, loginPassword:password}); return false; }
  if (u.status === "pending"){ setUI({loginErr:"Your account is awaiting admin approval. Please check back soon.", loginUsername:username, loginPassword:password}); return false; }
  state.session = u; state.screen="dashboard"; state.ui={};
  render();
  notify("Welcome back, " + u.name.split(" ")[0] + ".");
  return false;
}

/* FORGOT PASSWORD (sends a request to admin, since there's no email)  */
/* ------------------------------------------------------------------ */
function renderForgotPassword(){
  const sent = state.ui.resetSent;
  return `
  <div class="auth-wrap">
    <div class="card pad">
      <div class="section-title"><h2>Forgot password</h2></div>
      ${sent ? `
        <p class="section-sub">Request sent. Your school admin will reset your password and share the new one with you directly.</p>
        <button class="btn primary block" onclick="state.screen='login'; state.ui={}; render();">Back to log in</button>
      ` : `
        <p class="section-sub">There's no email on file, so a school admin will reset it for you. Enter your username and we'll flag it for them.</p>
        <form onsubmit="return doForgotPassword(event)">
          <label class="field"><span class="field-label">Username</span>
            <input class="input" id="forgotUsername" value="${esc(state.ui.forgotUsername||"")}" />
          </label>
          ${state.ui.forgotErr ? `<div class="err-box">${esc(state.ui.forgotErr)}</div>` : ""}
          <button class="btn primary block" type="submit">Send request to admin</button>
        </form>
        <p class="center-note"><button class="link-btn" onclick="state.screen='login'; state.ui={}; render();">Back to log in</button></p>
      `}
    </div>
  </div>`;
}
function doForgotPassword(e){
  e.preventDefault();
  const username = document.getElementById("forgotUsername").value.trim();
  const u = state.users.find(x => x.username.toLowerCase()===username.toLowerCase());
  if (!u){ setUI({forgotErr:"No account found with that username.", forgotUsername:username}); return false; }
  const req = { id: uid(), userId: u.id, username: u.username, name: u.name, requestedAt: new Date().toISOString(), status:"pending" };
  persistPasswordResets(state.passwordResets.concat([req]));
  setUI({resetSent:true});
  return false;
}
function persistPasswordResets(next){ state.passwordResets = next; saveKey(KEYS.passwordResets, next); }
function resolvePasswordReset(reqId){
  const req = state.passwordResets.find(r => r.id===reqId);
  if (!req) return;
  const tempPassword = "reset" + Math.floor(1000 + Math.random()*9000);
  persistUsers(state.users.map(u => u.id===req.userId ? { ...u, password: tempPassword } : u));
  persistPasswordResets(state.passwordResets.map(r => r.id===reqId ? { ...r, status:"resolved" } : r));
  render();
  notify(`New password for ${req.name}: ${tempPassword} — share this with them directly.`);
}
function dismissPasswordReset(reqId){
  persistPasswordResets(state.passwordResets.filter(r => r.id!==reqId));
  render();
}

/* CHANGE PASSWORD (for any logged-in user)                            */
/* ------------------------------------------------------------------ */
function renderChangePassword(){
  const err = state.ui.cpErr || "";
  return `
  <div class="auth-wrap">
    <div class="card pad">
      <div class="section-title"><h2>Change password</h2></div>
      <form onsubmit="return doChangePassword(event)">
        <label class="field"><span class="field-label">Current password</span>
          <div style="display:flex; gap:6px;">
            <input class="input" type="password" id="cpCurrent" style="flex:1;" />
            <button type="button" class="btn ghost sm" onclick="togglePwd('cpCurrent', this)">Show</button>
          </div>
        </label>
        <label class="field"><span class="field-label">New password</span>
          <div style="display:flex; gap:6px;">
            <input class="input" type="password" id="cpNew" style="flex:1;" />
            <button type="button" class="btn ghost sm" onclick="togglePwd('cpNew', this)">Show</button>
          </div>
        </label>
        <label class="field"><span class="field-label">Confirm new password</span>
          <div style="display:flex; gap:6px;">
            <input class="input" type="password" id="cpConfirm" style="flex:1;" />
            <button type="button" class="btn ghost sm" onclick="togglePwd('cpConfirm', this)">Show</button>
          </div>
        </label>
        ${err ? `<div class="err-box">${esc(err)}</div>` : ""}
        <button class="btn primary block" type="submit">Update password</button>
      </form>
      <p class="center-note"><button class="link-btn" onclick="state.screen='dashboard'; state.ui={}; render();">Cancel</button></p>
    </div>
  </div>`;
}
function doChangePassword(e){
  e.preventDefault();
  const current = document.getElementById("cpCurrent").value;
  const next = document.getElementById("cpNew").value;
  const confirm = document.getElementById("cpConfirm").value;
  if (current !== state.session.password){ setUI({cpErr:"Current password is incorrect."}); return false; }
  if (!next || next.length < 4){ setUI({cpErr:"New password must be at least 4 characters."}); return false; }
  if (next !== confirm){ setUI({cpErr:"New passwords don't match."}); return false; }
  const updated = { ...state.session, password: next };
  persistUsers(state.users.map(u => u.id===state.session.id ? updated : u));
  state.session = updated;
  state.screen = "dashboard"; state.ui = {};
  render();
  notify("Password updated.");
  return false;
}

        </label>` : ""}
        ${err ? `<div class="err-box">${esc(err)}</div>` : ""}
        <button class="btn primary block" type="submit">Sign up</button>
      </form>
      <p class="center-note">Already registered? <button class="link-btn" onclick="state.screen='login'; render();">Log in</button></p>
    </div>
  </div>`;
}
function doSignup(e){
  e.preventDefault();
  const name = document.getElementById("suName").value.trim();
  const username = document.getElementById("suUsername").value.trim();
  const password = document.getElementById("suPassword").value;
  const role = state.ui.signupRole || "student";
  if (!name || !username || !password){
    setUI({signupErr:"Please fill in every field.", suName:name, suUsername:username});
    return false;
  }
  if (state.users.some(u => u.username.toLowerCase()===username.toLowerCase())){
    setUI({signupErr:"That username is already taken.", suName:name, suUsername:username});
    return false;
  }
  const studentClass = role === "student" ? (state.ui.suClass || state.classes[0] || "") : undefined;
  const admissionNo = role === "student" ? (document.getElementById("suAdmissionNo").value.trim() || undefined) : undefined;
  const sex = role === "student" ? (document.getElementById("suSex").value || undefined) : undefined;
  const dob = role === "student" ? (document.getElementById("suDob").value || undefined) : undefined;
  const newUser = { id: uid(), name, username, password, role, status: "pending", studentClass, admissionNo, sex, dob };
  persistUsers(state.users.concat([newUser]));
  state.screen = "login"; state.ui = {};
  render();
  notify("Account created. An admin needs to approve it before you can log in.");
  return false;
}

function updateTeacherTotal(){
  const ca1 = Number(document.getElementById("teacherCA1").value||0);
  const ca2 = Number(document.getElementById("teacherCA2").value||0);
  const exam = Number(document.getElementById("teacherExam").value||0);
  const el = document.getElementById("teacherTotalDisplay");
  if (el) el.textContent = "Total: " + (ca1+ca2+exam) + "/100";
}
function submitScore(e){
  e.preventDefault();
  const studentId = state.ui.teacherStudentId;
  const ca1 = Number(document.getElementById("teacherCA1").value || 0);
  const ca2 = Number(document.getElementById("teacherCA2").value || 0);
  const exam = Number(document.getElementById("teacherExam").value || 0);
  const remark = document.getElementById("teacherRemark").value.trim();
  const editingId = state.ui.teacherEditingId;
  if (!studentId){ notify("Pick a student first.","bad"); return false; }
  const stu = state.users.find(u=>u.id===studentId);
  const mySubjectsForStu = stu ? teacherAssignedSubjectsForClass(state.session.id, stu.studentClass) : [];
  const subjectPicked = editingId
    ? state.ui.teacherSubject
    : ((state.ui.teacherSubject && mySubjectsForStu.includes(state.ui.teacherSubject)) ? state.ui.teacherSubject : mySubjectsForStu[0]);
  if (!editingId && (!subjectPicked || !teacherIsAssigned(state.session.id, subjectPicked, stu.studentClass))){
    notify(`You're not assigned to teach any subject for ${stu&&stu.studentClass||"this class"}. Contact the admin if this looks wrong.`, "bad");
    return false;
  }
  if (document.getElementById("teacherCA1").value==="" && document.getElementById("teacherCA2").value==="" && document.getElementById("teacherExam").value===""){
    notify("Enter at least CA1, CA2 or Exam score.","bad"); return false;
  }
  if (ca1>20 || ca2>20 || exam>60){ notify("CA1/CA2 max 20, Exam max 60.","bad"); return false; }
  const score = ca1 + ca2 + exam;
  const subject = subjectPicked;
  const term = state.ui.teacherTerm || "1st Term";
  const session = state.ui.teacherSession || state.currentSession;
  if (editingId){
    const next = state.academics.results.map(r => r.id===editingId ? { ...r, subject, term, session, ca1, ca2, exam, score, remark, approved:false } : r);
    persistAcademics({ ...state.academics, results: next });
    notify("Score updated — it will need admin approval again.");
  } else {
    const entry = { id:uid(), studentId, subject, term, session, ca1, ca2, exam, score, remark, approved:false, enteredBy: state.session.id };
    persistAcademics({ ...state.academics, results: state.academics.results.concat([entry]) });
    notify("Score submitted — it will show for the student once admin approves it.");
  }
  setUI({ teacherEditingId:"", teacherCA1:"", teacherCA2:"", teacherExam:"", teacherRemark:"" });
  render();
  return false;
}
function editScore(id){
  const r = state.academics.results.find(x=>x.id===id);
  if (!r) return;
  const st = state.users.find(u=>u.id===r.studentId);
  if (!hasEditAccess(state.session.id, st ? st.studentClass : null, r.subject)){
    notify("This score is locked. Ask the admin to grant edit access for this class or subject.","bad");
    return;
  }
  setUI({ teacherEditingId:id, teacherSubject:r.subject, teacherTerm:r.term, teacherSession:r.session||state.currentSession, teacherCA1:r.ca1!=null?String(r.ca1):"", teacherCA2:r.ca2!=null?String(r.ca2):"", teacherExam:r.exam!=null?String(r.exam):(r.score!=null?String(r.score):""), teacherRemark:r.remark||"" });
}
function deleteScore(id){
  const r = state.academics.results.find(x=>x.id===id);
  if (!r) return;
  const st = state.users.find(u=>u.id===r.studentId);
  if (!hasEditAccess(state.session.id, st ? st.studentClass : null, r.subject)){
    notify("This score is locked. Ask the admin to grant edit access for this class or subject.","bad");
    return;
  }
  const next = state.academics.results.filter(x=>x.id!==id);
  persistAcademics({ ...state.academics, results: next });
  notify("Score deleted.");
  setUI({ teacherEditingId:"", teacherCA1:"", teacherCA2:"", teacherExam:"", teacherRemark:"" });
}
function cancelEditScore(){
  setUI({ teacherEditingId:"", teacherCA1:"", teacherCA2:"", teacherExam:"", teacherRemark:"" });
}
function submitAssignment(e){

function parseFeeCSV(text){
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const rows = [];
  for (const line of lines){
    const parts = line.split(",").map(p => p.trim());
    if (parts.length < 3) continue;
    if (/admission/i.test(parts[0])) continue; // skip header row
    const [admissionNo, amountDue, amountPaid] = parts;
    if (!admissionNo) continue;
    rows.push({ admissionNo, amountDue: Number(amountDue)||0, amountPaid: Number(amountPaid)||0 });
  }
  return rows;
}
function applyBulkFeeRows(rows, term){
  const notFound = [];
  let nextFees = state.fees.slice();
  let updated = 0;
  rows.forEach(row => {
    const student = state.users.find(u => u.role==="student" && (u.admissionNo||"").toLowerCase()===row.admissionNo.toLowerCase());
    if (!student){ notFound.push(row.admissionNo); return; }
    const existing = nextFees.find(f => f.studentId===student.id && f.term===term);
    const record = { id: existing?existing.id:uid(), studentId: student.id, term, amountDue: row.amountDue, amountPaid: row.amountPaid, adjustments: existing?(existing.adjustments||[]):[] };
    nextFees = existing ? nextFees.map(f => f.id===existing.id ? record : f) : nextFees.concat([record]);
    updated++;
  });
  persistFees(nextFees);
  setUI({ bulkResult: { term, updated, notFound } });
  notify(updated ? `Updated ${updated} fee record${updated===1?"":"s"}.` : "No matching admission numbers found.", updated ? "good" : "bad");
}
function bulkFeeFileUpload(event){
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const term = state.ui.bulkTerm || "1st Term";
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseFeeCSV(String(reader.result));
    if (!rows.length){ notify("Couldn't find any valid rows in that file.", "bad"); return; }
    applyBulkFeeRows(rows, term);
  };
  reader.onerror = () => notify("Couldn't read that file.", "bad");
  reader.readAsText(file);
}
function applyBulkFeePaste(){
  const text = document.getElementById("bulkPasteText").value;
  const term = state.ui.bulkTerm || "1st Term";
  const rows = parseFeeCSV(text);
  if (!rows.length){ notify("Add at least one row first.", "bad"); return; }
  applyBulkFeeRows(rows, term);
}

/* ---- WAEC-style grading ---- */
function waecGrade(score){
  const n = Number(score);
  if (n >= 75) return { grade:"A1", remark:"Excellent" };
  if (n >= 70) return { grade:"B2", remark:"Very Good" };
  if (n >= 65) return { grade:"B3", remark:"Good" };
  if (n >= 60) return { grade:"C4", remark:"Credit" };
  if (n >= 55) return { grade:"C5", remark:"Credit" };
  if (n >= 50) return { grade:"C6", remark:"Credit" };
  if (n >= 45) return { grade:"D7", remark:"Pass" };
  if (n >= 40) return { grade:"E8", remark:"Pass" };
  return { grade:"F9", remark:"Fail" };
}

/* ---- Class averages / positions / report cards ---- */
/* Standard class-list ordering: males first (alphabetical), then females
   (alphabetical), continuing the same serial number across both groups.
   Students with no sex on file are listed last, alphabetically. */
function genderRank(sex){ if (sex==="Male") return 0; if (sex==="Female") return 1; return 2; }
function sortStudentsClassOrder(list){
  return list.slice().sort((a,b) => {
    const g = genderRank(a.sex) - genderRank(b.sex);
    if (g !== 0) return g;
    return (a.name||"").localeCompare(b.name||"");
  });
}
function classResultsFor(studentClass, session, term){
  const students = state.users.filter(u => u.role==="student" && u.status==="approved" && u.studentClass===studentClass);
  const rows = students.map(st => {
    const results = state.academics.results.filter(r => r.studentId===st.id && r.session===session && r.term===term && r.approved);
    const total = results.reduce((sum,r) => sum + Number(r.score), 0);
    const count = results.length;
    const average = count ? total/count : 0;
    return { student: st, results, total, count, average };
  });
  const ranked = rows.filter(r => r.count>0).sort((a,b) => b.average - a.average);
  let lastAvg = null, lastPos = 0;
  ranked.forEach((r,i) => {
    if (r.average !== lastAvg){ lastPos = i+1; lastAvg = r.average; }
    r.position = lastPos;
  });
  const unranked = rows.filter(r => r.count===0).map(r => ({...r, position:null}));
  return { ranked, unranked, classSize: ranked.length };
}

function ordinal(n){
  const s = ["th","st","nd","rd"], v = n % 100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}

function downloadStudentRosterCSV(cls){
  const classStudents = sortStudentsClassOrder(state.users.filter(u => u.role==="student" && u.status==="approved" && u.studentClass===cls));
  if (classStudents.length===0){ notify("No students in this class yet.", "bad"); return; }
  const header = ["S/N","Name","Sex","Admission No.","Date of Birth"];
  const lines = [header.join(",")];
  classStudents.forEach((st, i) => {
    const dob = st.dob ? new Date(st.dob).toLocaleDateString("en-GB") : "";
    const row = [i+1, `"${(st.name||"").replace(/"/g,'""')}"`, st.sex||"", st.admissionNo||"", dob];
    lines.push(row.join(","));
  });
  const blob = new Blob([lines.join("\n")], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${cls.replace(/\s+/g,"-")}-class-list.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  notify("Class list downloaded (.csv).");
}
function feeSummaryByClassHTML(term){
  const today = new Date().toLocaleDateString("en-GB");

    classStudents.forEach(st => {
      const f = state.fees.find(x => x.studentId===st.id && x.term===term);
      if (!f || f.amountPaid<=0) none++;
      else if (f.amountPaid >= feeTotalDue(f)) full++;

  const totals = rows.reduce((a,r) => ({ total:a.total+r.total, full:a.full+r.full, partial:a.partial+r.partial, none:a.none+r.none }), { total:0, full:0, partial:0, none:0 });

      <tbody>

function bulkApproveClassResults(cls, session, term){
  const classStudentIds = new Set(state.users.filter(u => u.role==="student" && u.studentClass===cls).map(u=>u.id));
  let count = 0;
  const next = state.academics.results.map(r => {
    if (classStudentIds.has(r.studentId) && r.session===session && r.term===term && !r.approved){
      count++;
      return { ...r, approved: true };
    }
    return r;
  });
  persistAcademics({ ...state.academics, results: next });
  if (count===0) notify("No pending results to approve for this class/session/term.","bad");
  else notify(`Approved ${count} result(s) for ${cls} — ${session} ${term}.`);
}
function generateResultsAllClasses(session, term){
  if (!state.classes.length){ notify("No classes set up yet.", "bad"); return; }
  const classStudentMap = {};
  state.classes.forEach(cls => {
    classStudentMap[cls] = new Set(state.users.filter(u => u.role==="student" && u.studentClass===cls).map(u=>u.id));
  });
  let total = 0;
  const perClassCounts = {};
  const next = state.academics.results.map(r => {
    if (r.session!==session || r.term!==term || r.approved) return r;
    const cls = state.classes.find(c => classStudentMap[c].has(r.studentId));
    if (!cls) return r;
    total++;
    perClassCounts[cls] = (perClassCounts[cls]||0) + 1;
    return { ...r, approved: true };
  });
  persistAcademics({ ...state.academics, results: next });
  if (total===0){ notify(`No pending results to generate for ${session} ${term} across any class.`, "bad"); return; }
  const summary = Object.entries(perClassCounts).map(([c,n]) => `${c}: ${n}`).join(", ");
  notify(`Generated results for ${total} entr${total===1?"y":"ies"} across ${Object.keys(perClassCounts).length} class(es) — ${summary}.`);
}
function runClassResultsAction(value, cls, session, term){
  if (!value) return;
  if (value==="approveAll") bulkApproveClassResults(cls, session, term);
  else if (value==="printAll") printAllReportCards(cls, session, term);
  else if (value==="printMaster") printMasterList(cls, session, term);
  const sel = document.getElementById("classResultsActionSelect");
  if (sel) sel.value = "";
}

}

function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim){ height = Math.round(height*(maxDim/width)); width = maxDim; }
        else if (height >= width && height > maxDim){ width = Math.round(width*(maxDim/height)); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => reject(new Error("Not a readable image."));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("Could not read that file."));
    reader.readAsDataURL(file);
  });
}
async function handlePhotoUpload(studentId, input){
  const file = input.files && input.files[0];
  if (!file) return;
  if (!file.type.startsWith("image/")){ notify("Please choose an image file.", "bad"); return; }
  try {
    const dataUrl = await resizeImageFile(file, 320, 0.75);
    persistUsers(state.users.map(u => u.id===studentId ? { ...u, photo: dataUrl } : u));
    render();
    notify("Photo updated.");
  } catch (e) {
    notify(e.message || "Could not read that image.", "bad");
  }
}
function makeUniqueUsername(name){
  let base = name.toLowerCase().trim().replace(/[^a-z\s]/g,"").trim().replace(/\s+/g,".");
  if (!base) base = "student";
  let candidate = base, n = 1;
  while (state.users.some(u => u.username.toLowerCase()===candidate)){
    n += 1;
    candidate = base + n;
  }
  return candidate;
}
function addStudent(name, cls, admissionNo, sex, dob){

  if (admissionNo && state.users.some(u => u.role==="student" && (u.admissionNo||"").toLowerCase()===admissionNo.toLowerCase())){
    notify("Another student already has that admission number.", "bad");
    return;

  const username = makeUniqueUsername(name);
  const password = "student123";
  const student = { id: uid(), name, username, password, role:"student", status:"approved", studentClass: cls, admissionNo, sex: sex||undefined, dob: dob||undefined };
  persistUsers(state.users.concat([student]));
  setUI({ studentAddName:"", studentAddAdmissionNo:"" });
  notify(`Added ${name}. Login — username: ${username}, password: ${password}`);
}
/* Removes a user who's no longer with the school. Students take their
   academic/fee/release-override history with them (their record isn't
   useful to keep live once they've left). Staff removal only clears their
   login and any edit-access grants — it never touches results or
   assignments they created, since those belong to the school's records. */
function removeUser(userId){
  const user = state.users.find(u => u.id===userId);
  if (!user){ notify("That user no longer exists.", "bad"); return; }
  if (state.session && state.session.id===userId){ notify("You can't remove the account you're currently logged in as.", "bad"); return; }
  if (user.role==="admin" && state.users.filter(u=>u.role==="admin").length<=1){ notify("You can't remove the only remaining admin account.", "bad"); return; }
  const label = user.role==="student" ? `${user.name} (${user.studentClass||"Unassigned"})` : `${user.name} (${user.role})`;
  if (!window.confirm(`Remove ${label}? ${user.role==="student" ? "This also deletes their results, fee records, and release overrides." : "This removes their login and any edit-access grants."} This can't be undone from inside the app — download a backup first if unsure.`)) return;

  persistUsers(state.users.filter(u => u.id!==userId));

  if (user.role==="student"){
    persistAcademics({ ...state.academics, results: state.academics.results.filter(r => r.studentId!==userId) });
    persistFees(state.fees.filter(f => f.studentId!==userId));
    persistWithheld(state.withheld.filter(k => k.split("||")[0]!==userId));
    persistForceReleased(state.forceReleased.filter(k => k.split("||")[0]!==userId));
  } else {
    persistEditGrants(state.editGrants.filter(g => g.teacherId!==userId));
  }
  render();
  notify(`Removed ${user.name}.`);
}
function setStudentClass(studentId, cls){
  persistUsers(state.users.map(u => u.id===studentId ? { ...u, studentClass: cls } : u));
  notify("Class updated.");
  render();
}
function setStudentSex(studentId, val){
  persistUsers(state.users.map(u => u.id===studentId ? { ...u, sex: val||undefined } : u));
  notify("Sex updated.");
  render();
}
function setStudentDob(studentId, val){
  persistUsers(state.users.map(u => u.id===studentId ? { ...u, dob: val||undefined } : u));
  notify("Date of birth updated.");
  render();
}
function setStudentAdmissionNo(studentId, val){
  const admissionNo = val.trim();
  if (admissionNo && state.users.some(u => u.id!==studentId && u.role==="student" && (u.admissionNo||"").toLowerCase()===admissionNo.toLowerCase())){
    notify("Another student already has that admission number.", "bad");
    render();
    return;
  }
  persistUsers(state.users.map(u => u.id===studentId ? { ...u, admissionNo: admissionNo || undefined } : u));
  notify("Admission number updated.");
  render();
}
function downloadBackup(){
  const payload = {
    exportedAt: new Date().toISOString(),
    school: "Faith International Secondary School, Itobe",
    users: state.users,
    subjects: state.subjects,
    classes: state.classes,
    academics: state.academics,
    fees: state.fees,
    releases: state.releases,
    withheld: state.withheld,
    forceReleased: state.forceReleased,
    passwordResets: state.passwordResets,
    sessions: state.sessions,
    currentSession: state.currentSession,
    announcements: state.announcements,
    editGrants: state.editGrants,
    teacherAssignments: state.teacherAssignments,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const datePart = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `fissi-portal-backup-${datePart}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  notify("Backup downloaded.");
}
/* Archives one full session's results out of the live portal: downloads a
   scoped file first, then strips that session's results, releases, and
   withhold/force-release overrides from the live data. Never touches users,
   subjects, classes, or fees — this is purely about shrinking the academics
   history that piles up year over year. */
function archiveSession(session){
  if (!session){ notify("Pick a session to archive.", "bad"); return; }
  if (session === state.currentSession){ notify("You can't archive the currently active session.", "bad"); return; }
  const resultsToArchive = state.academics.results.filter(r => r.session===session);
  const releasesToArchive = state.releases.filter(k => k.split("||")[1]===session);
  const withheldToArchive = state.withheld.filter(k => k.split("||")[1]===session);
  const forceReleasedToArchive = state.forceReleased.filter(k => k.split("||")[1]===session);
  if (resultsToArchive.length===0){ notify(`No results found for ${session} to archive.`, "bad"); return; }
  if (!window.confirm(`This downloads a backup of all ${resultsToArchive.length} result(s) for ${session}, then permanently removes them from the live portal. Make sure the download finishes and is saved somewhere safe before continuing. Proceed?`)) return;
  const payload = {
    exportedAt: new Date().toISOString(),
    school: "Faith International Secondary School, Itobe",
    archivedSession: session,
    note: "Archive of one session's results, taken out of the live portal. This is not a full portal backup — use Download Backup for that.",
    users: state.users.filter(u => u.role==="student"),
    subjects: state.subjects,
    classes: state.classes,
    results: resultsToArchive,
    releases: releasesToArchive,
    withheld: withheldToArchive,
    forceReleased: forceReleasedToArchive,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const datePart = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `fissi-archive-${session.replace(/[\/\s]+/g,"-")}-${datePart}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);

  persistAcademics({ ...state.academics, results: state.academics.results.filter(r => r.session!==session) });
  persistReleases(state.releases.filter(k => k.split("||")[1]!==session));
  persistWithheld(state.withheld.filter(k => k.split("||")[1]!==session));
  persistForceReleased(state.forceReleased.filter(k => k.split("||")[1]!==session));
  render();
  notify(`Archived ${resultsToArchive.length} result(s) for ${session}. File downloaded, and they've been removed from the live portal.`);
}
function restoreBackup(event){
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.users)) throw new Error("This doesn't look like a FISSI backup file.");
      persistUsers(data.users || []);
      persistSubjects(data.subjects || DEFAULT_SUBJECTS.slice());
      persistClasses(data.classes || DEFAULT_CLASSES.slice());
      persistAcademics(data.academics || { results: [], assignments: [] });
      persistFees(data.fees || []);
      persistReleases(data.releases || []);
      persistWithheld(data.withheld || []);
      persistForceReleased(data.forceReleased || []);
      persistPasswordResets(data.passwordResets || []);
      persistSessions((data.sessions && data.sessions.length) ? data.sessions : DEFAULT_SESSIONS.slice());
      persistAnnouncements(data.announcements || []);
      persistEditGrants(data.editGrants || []);
      persistTeacherAssignments(data.teacherAssignments || []);
      const restoredSession = (data.currentSession && state.sessions.includes(data.currentSession)) ? data.currentSession : state.sessions[0];
      state.currentSession = restoredSession;
      saveKey(KEYS.currentSession, restoredSession);
      render();
      notify("Backup restored. All records have been replaced.");
    } catch (e) {
      notify("Couldn't read that file — " + e.message, "bad");
    }
  };
  reader.onerror = () => notify("Couldn't read that file.", "bad");
  reader.readAsText(file);
}
function decideUser(id, approve){
  const next = approve ? state.users.map(u=>u.id===id?{...u,status:"approved"}:u) : state.users.filter(u=>u.id!==id);
  persistUsers(next);
  notify(approve ? "Account approved." : "Account rejected and removed.");
  render();
}
function decideResult(id, approve){
  const next = approve ? state.academics.results.map(r=>r.id===id?{...r,approved:true}:r) : state.academics.results.filter(r=>r.id!==id);
  persistAcademics({ ...state.academics, results: next });
  notify(approve ? "Result approved and released to student." : "Result rejected and removed.");
  render();
}
function addSubject(e){
  e.preventDefault();
  const v = document.getElementById("newSubject").value.trim();
  if (!v || state.subjects.includes(v)) return false;
  persistSubjects(state.subjects.concat([v]));
  notify("Subject added.");
  render();
  return false;
}
function removeSubject(sub){
  persistSubjects(state.subjects.filter(x=>x!==sub));
  notify("Subject removed.");
  render();
}

init();
</script>
